[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-bridge"
version = "0.1.0"
description = "Run local commands on GitHub Actions and read the results back"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yam Carrasco" }]
dependencies = []

[project.scripts]
gh-bridge = "bridge.cli:main"

[tool.setuptools]
packages = ["bridge"]
